<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#245892" />
    <title>Rikscha – Hospizinitiative Melle</title>

    <!--
      Symbole und Manifest. Alle Pfade sind relativ, weil die App unter einem
      Unterordner liegt (…/Rikscha-Projekt/).
    -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Auf dem iPhone ohne Browserleiste starten -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rikscha Melle" />
    <meta name="description" content="Fahrten und Pilot:innen der Aktion Radeln ohne Alter in Melle verwalten." />

    <!--
      Start-Diagnose: laeuft vor der eigentlichen App und faengt alles ab,
      was das Laden verhindert (Netzwerkfehler, Syntaxfehler, haengender Start).
      Bewusst ohne externe Dateien und ohne modernes JS, damit es selbst dann
      funktioniert, wenn sonst nichts laedt.
    -->
    <script>
      (function () {
        var CODES = {
          'E-BOOT-TIMEOUT': 'Die App wurde geladen, ist aber nicht gestartet.',
          'E-SCRIPT-LOAD': 'Eine Programmdatei konnte nicht geladen werden.',
          'E-RUNTIME': 'Beim Start ist ein Programmfehler aufgetreten.',
          'E-PROMISE': 'Eine Hintergrundanfrage ist fehlgeschlagen.',
          'E-MOUNT': 'Die Oberflaeche konnte nicht aufgebaut werden.',
          'E-RENDER': 'Beim Anzeigen ist ein Fehler aufgetreten.'
        }

        var shown = false

        function esc(value) {
          return String(value == null ? '' : value).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
          })
        }

        window.__rikschaShowError = function (code, message, detail) {
          if (shown) return
          shown = true

          var root = document.getElementById('root')
          if (!root) return

          var info = [
            'Code: ' + code,
            'Meldung: ' + (message || '-'),
            detail ? 'Detail: ' + detail : null,
            'Adresse: ' + location.href,
            'Zeit: ' + new Date().toLocaleString('de-DE'),
            'Browser: ' + navigator.userAgent
          ].filter(Boolean).join('\n')

          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;' +
            'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef2f7;color:#1f2a37">' +
              '<div style="max-width:460px;width:100%;background:#fff;border:1px solid #d9e1ec;border-radius:16px;' +
              'padding:28px 24px;box-shadow:0 12px 32px rgba(11,33,60,.12)">' +
                '<div style="font-size:32px;line-height:1">⚠️</div>' +
                '<h1 style="margin:10px 0 6px;font-size:19px">Die App konnte nicht geladen werden</h1>' +
                '<p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#5b6b7f">' +
                  esc(CODES[code] || 'Es ist ein unerwarteter Fehler aufgetreten.') +
                '</p>' +
                '<div style="background:#fdecea;color:#b3261e;border-radius:10px;padding:12px 14px;margin-bottom:16px">' +
                  '<div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:14px">' +
                    esc(code) +
                  '</div>' +
                  (message
                    ? '<div style="font-size:13px;margin-top:6px;word-break:break-word">' + esc(message) + '</div>'
                    : '') +
                '</div>' +
                '<details style="margin-bottom:16px">' +
                  '<summary style="cursor:pointer;font-size:14px;color:#1a4270;font-weight:600">Technische Details</summary>' +
                  '<pre id="rikscha-error-info" style="margin:10px 0 0;padding:12px;background:#eef2f7;border-radius:8px;' +
                  'font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#3d4a5c">' +
                    esc(info) +
                  '</pre>' +
                '</details>' +
                '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
                  '<button id="rikscha-reload" style="flex:1;min-width:130px;padding:12px 16px;font-size:15px;' +
                  'font-weight:600;border:0;border-radius:10px;background:#245892;color:#fff;cursor:pointer">' +
                    'Neu laden' +
                  '</button>' +
                  '<button id="rikscha-copy" style="flex:1;min-width:130px;padding:12px 16px;font-size:15px;' +
                  'font-weight:600;border:1px solid #d9e1ec;border-radius:10px;background:#fff;color:#1a4270;cursor:pointer">' +
                    'Details kopieren' +
                  '</button>' +
                '</div>' +
                '<p style="margin:16px 0 0;font-size:13px;color:#5b6b7f;line-height:1.5">' +
                  'Bleibt der Fehler bestehen, schicke die technischen Details bitte an die Koordination.' +
                '</p>' +
              '</div>' +
            '</div>'

          var reload = document.getElementById('rikscha-reload')
          if (reload) {
            reload.onclick = function () {
              location.reload()
            }
          }

          var copy = document.getElementById('rikscha-copy')
          if (copy) {
            copy.onclick = function () {
              var text = document.getElementById('rikscha-error-info').textContent
              var done = function () {
                copy.textContent = 'Kopiert ✓'
              }
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, done)
              } else {
                var area = document.createElement('textarea')
                area.value = text
                document.body.appendChild(area)
                area.select()
                try { document.execCommand('copy') } catch (e) {}
                document.body.removeChild(area)
                done()
              }
            }
          }
        }

        // Gehoert der Fehler ueberhaupt zu dieser App?
        //
        // Browser melden Fehler aus fremdem Code - Erweiterungen, eingespritzte
        // Skripte, in Safari auch das Teilen-Menue - als blosses
        // "Script error." ohne Datei und Zeile. Solche Meldungen sagen nichts
        // ueber den Zustand der App aus und duerfen sie nicht ersetzen.
        function istEigenerFehler(event) {
          if (!event.filename) return false
          return event.filename.indexOf(location.origin) === 0
        }

        // Datei konnte nicht geladen werden (Netzwerk, 404, falscher Pfad).
        // capture:true, weil solche Fehler nicht nach oben blubbern.
        window.addEventListener('error', function (event) {
          var target = event.target
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            // Nur eigene Programmdateien, nicht was eine Erweiterung nachlaedt
            var quelle = target.src || target.href || ''
            if (quelle.indexOf(location.origin) !== 0) return

            window.__rikschaShowError(
              'E-SCRIPT-LOAD',
              'Nicht erreichbar: ' + quelle,
              'Pruefe, ob die Seite vollstaendig veroeffentlicht wurde.'
            )
            return
          }

          // Laeuft die App bereits, ersetzt ein Laufzeitfehler sie nicht mehr.
          // Echte Anzeigefehler faengt weiterhin die ErrorBoundary in React ab.
          if (window.__rikschaAppMounted) return

          if (event.message && istEigenerFehler(event)) {
            window.__rikschaShowError(
              'E-RUNTIME',
              event.message,
              event.filename + ':' + event.lineno + ':' + event.colno
            )
          }
        }, true)

        window.addEventListener('unhandledrejection', function (event) {
          // Nach dem Start nicht mehr uebernehmen: eine abgebrochene Anfrage
          // beim Seitenwechsel ist kein Grund, die Oberflaeche wegzunehmen.
          if (window.__rikschaAppMounted) return

          var reason = event.reason
          window.__rikschaShowError(
            'E-PROMISE',
            (reason && (reason.message || reason.error_description)) || String(reason)
          )
        })

        // Wachhund: Wenn die App nach 12 Sekunden nicht gestartet ist,
        // bleibt der Ladehinweis nicht endlos stehen.
        setTimeout(function () {
          if (!window.__rikschaAppMounted) {
            window.__rikschaShowError(
              'E-BOOT-TIMEOUT',
              'Die Anwendung hat sich innerhalb von 12 Sekunden nicht gemeldet.',
              'Meist eine unterbrochene Verbindung oder eine unvollstaendige Veroeffentlichung.'
            )
          }
        }, 12000)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <p style="font-family:system-ui,-apple-system,sans-serif;color:#5b6b7f;padding:24px">
        Rikscha-App wird geladen …
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="font-family:system-ui,-apple-system,sans-serif;padding:24px">
        Diese App benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.
      </p>
    </noscript>
  </body>
</html>
