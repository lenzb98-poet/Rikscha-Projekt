name: Datensicherung

# Jeden Sonntag eine vollständige Sicherung der Datenbank: alle Fahrten,
# Personen, Chat-Nachrichten, Einstellungen und die Anmeldekonten.
#
# Die Sicherung wird mit einem Passwort verschlüsselt, bevor sie GitHub
# erreicht - sie enthält Namen und Telefonnummern. Sie liegt 90 Tage lang
# unter Actions -> Datensicherung -> (Lauf) -> Artifacts. Wiederherstellen:
# siehe README, Abschnitt "Datensicherung".
#
# Benötigte Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL   Verbindung über den "Session pooler" aus dem Supabase-
#                     Dashboard (Connect), mit eingesetztem Datenbank-Passwort
#   BACKUP_PASSWORT   frei gewähltes Passwort für die Verschlüsselung -
#                     gut aufbewahren, ohne es ist die Sicherung wertlos

on:
  schedule:
    - cron: '17 3 * * 0'   # sonntags, 03:17 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets prüfen
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSWORT: ${{ secrets.BACKUP_PASSWORT }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSWORT" ]; then
            echo "::error::SUPABASE_DB_URL oder BACKUP_PASSWORT fehlt in den Repository-Secrets (siehe README, Abschnitt Datensicherung)."
            exit 1
          fi

      # pg_dump muss zur Postgres-Version von Supabase passen (17)
      - name: Datenbank sichern
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          datei="rikscha-sicherung-$(date -u +%Y-%m-%d).dump"
          docker run --rm -e DB_URL postgres:17 sh -c \
            'pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --schema=public --schema=auth --schema=storage' \
            > "$datei"
          test -s "$datei"
          docker run --rm -v "$PWD:/d" postgres:17 pg_restore --list "/d/$datei" > inhalt.txt
          echo "Gesichert: $(du -h "$datei" | cut -f1), $(grep -c 'TABLE DATA' inhalt.txt) Tabellen mit Daten"
          echo "DATEI=$datei" >> "$GITHUB_ENV"

      - name: Verschlüsseln
        env:
          PASSWORT: ${{ secrets.BACKUP_PASSWORT }}
        run: |
          printf '%s' "$PASSWORT" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$DATEI.gpg" "$DATEI"
          rm "$DATEI" inhalt.txt
          ls -la "$DATEI.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATEI }}
          path: ${{ env.DATEI }}.gpg
          retention-days: 90
          if-no-files-found: error

      # Wie beim Wachhalten: in ruhigen Zeiten nicht abschalten lassen
      - name: Zeitplan eingeschaltet lassen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sicherung.yml/enable" || echo "::warning::Zeitplan ließ sich nicht erneuern."
